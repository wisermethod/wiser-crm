name: Weekly upstream report

on:
  schedule:
    - cron: '23 5 * * 2'
  workflow_dispatch:

permissions: { contents: read, issues: write, actions: read }

concurrency:
  group: upstream-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.10.0'
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: '10.30.3'
          run_install: false
      - name: Fetch upstream main only
        run: |
          git remote add clawnify https://github.com/clawnify/OpenCRM.git
          git remote set-url --push clawnify PUSH-DISABLED-never-push-to-clawnify
          git fetch --no-tags clawnify main:refs/remotes/clawnify/main
      - name: Read workflow states
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/actions/workflows" > "$RUNNER_TEMP/upstream-workflows.json"
      - name: Write upstream report
        run: |
          node release/upstream-report.mjs --repo "$GITHUB_WORKSPACE" --upstream clawnify/main --out "$RUNNER_TEMP/upstream-report" --workflows "$RUNNER_TEMP/upstream-workflows.json"
      - name: File weekly report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "Upstream report $(date -u +%F)" --body-file "$RUNNER_TEMP/upstream-report/upstream-report.md"
